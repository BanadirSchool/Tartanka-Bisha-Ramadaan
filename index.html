<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tartan Diimey Ramadan - Sahal Schools</title>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* Ramadan Decorative Elements */
        .ramadan-decoration {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 0;
        }

        .moon {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 100px;
            height: 100px;
            background: linear-gradient(145deg, #fff5d6, #ffd700);
            border-radius: 50%;
            box-shadow: 0 0 80px rgba(255, 215, 0, 0.6);
            animation: moonPulse 3s ease-in-out infinite;
        }

        .star {
            position: absolute;
            color: #ffd700;
            font-size: 30px;
            animation: starTwinkle 1.5s ease-in-out infinite;
            text-shadow: 0 0 20px gold;
        }

        .star-1 { top: 15%; left: 10%; }
        .star-2 { top: 25%; right: 15%; animation-delay: 0.3s; }
        .star-3 { bottom: 25%; left: 15%; animation-delay: 0.6s; }
        .star-4 { bottom: 35%; right: 20%; animation-delay: 0.9s; }

        .lantern {
            position: absolute;
            bottom: 30px;
            left: 30px;
            font-size: 70px;
            color: #c9a86c;
            opacity: 0.5;
            animation: lanternSwing 3s ease-in-out infinite;
        }

        .lantern-2 {
            bottom: 30px;
            right: 30px;
            left: auto;
            animation-delay: 1.5s;
        }

        @keyframes moonPulse {
            0%, 100% { transform: scale(1); box-shadow: 0 0 80px rgba(255, 215, 0, 0.6); }
            50% { transform: scale(1.1); box-shadow: 0 0 120px rgba(255, 215, 0, 0.9); }
        }

        @keyframes starTwinkle {
            0%, 100% { opacity: 0.3; transform: scale(0.8) rotate(0deg); }
            50% { opacity: 1; transform: scale(1.3) rotate(180deg); }
        }

        @keyframes lanternSwing {
            0%, 100% { transform: rotate(8deg) translateY(0); }
            50% { transform: rotate(-8deg) translateY(-15px); }
        }

        /* Main Container */
        .game-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 1000px;
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(10px);
            border-radius: 60px;
            padding: 40px;
            box-shadow: 0 30px 80px rgba(30, 60, 63, 0.4);
            border: 4px solid #1e3c3f;
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 4px dashed #c9a86c;
        }

        .school-name {
            font-size: 2.5rem;
            font-weight: 800;
            color: #1e3c3f;
            font-family: 'Amiri', serif;
        }

        .school-name i {
            color: #c9a86c;
            margin: 0 15px;
            animation: spin 5s linear infinite;
        }

        .contest-title {
            font-size: 3rem;
            color: #2c5a5e;
            font-family: 'Amiri', serif;
            background: linear-gradient(45deg, #1e3c3f, #c9a86c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .contest-title span {
            font-size: 4rem;
            display: inline-block;
            animation: bounce 1s ease-in-out infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        @keyframes spin {
            0% { transform: rotateY(0deg); }
            100% { transform: rotateY(360deg); }
        }

        /* Audio Permission Button */
        .audio-permission {
            background: linear-gradient(135deg, #1e3c3f, #2c5a5e);
            color: white;
            padding: 25px;
            border-radius: 70px;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 30px;
            border: 4px solid #c9a86c;
            animation: pulse 2s ease-in-out infinite;
        }

        .enable-audio-btn {
            background: linear-gradient(135deg, gold, #ffd700);
            color: #1e3c3f;
            border: none;
            padding: 18px 50px;
            border-radius: 60px;
            font-size: 1.5rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            border: 3px solid white;
        }

        .enable-audio-btn:hover {
            transform: scale(1.15) rotate(2deg);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        .enable-audio-btn i {
            margin-right: 15px;
            animation: ring 1s ease-in-out infinite;
        }

        @keyframes ring {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(20deg); }
            75% { transform: rotate(-20deg); }
        }

        /* Score Bar */
        .score-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(145deg, #1e3c3f, #2c5a5e);
            padding: 20px 30px;
            border-radius: 100px;
            margin-bottom: 30px;
            color: white;
            border: 3px solid #c9a86c;
        }

        .score-item {
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 1.3rem;
        }

        .score-item i {
            color: gold;
            font-size: 2rem;
            animation: spin 4s linear infinite;
        }

        .money-display {
            background: white;
            color: #1e3c3f;
            padding: 12px 30px;
            border-radius: 60px;
            font-size: 2rem;
            font-weight: 800;
            box-shadow: 0 8px 0 #c9a86c;
            display: flex;
            align-items: center;
            gap: 10px;
            animation: moneyGlow 2s ease-in-out infinite;
        }

        @keyframes moneyGlow {
            0%, 100% { box-shadow: 0 8px 0 #c9a86c, 0 0 20px gold; }
            50% { box-shadow: 0 8px 0 #c9a86c, 0 0 40px gold; }
        }

        .money-display i {
            color: gold;
            font-size: 2.5rem;
            animation: spin 3s linear infinite;
        }

        /* Question Container */
        .question-container {
            background: white;
            border: 5px solid #1e3c3f;
            border-radius: 50px;
            padding: 40px;
            margin-bottom: 30px;
            position: relative;
            box-shadow: 0 15px 0 #2c5a5e;
        }

        .question-header {
            position: absolute;
            top: -25px;
            left: 40px;
            background: linear-gradient(145deg, #1e3c3f, #2c5a5e);
            color: white;
            padding: 12px 40px;
            border-radius: 60px;
            font-size: 1.3rem;
            border: 3px solid #c9a86c;
        }

        .question-money {
            position: absolute;
            top: -25px;
            right: 40px;
            background: linear-gradient(145deg, gold, #ffd700);
            color: #1e3c3f;
            padding: 12px 40px;
            border-radius: 60px;
            font-size: 2rem;
            font-weight: 800;
            border: 3px solid #1e3c3f;
            animation: moneyDance 1.5s ease-in-out infinite;
        }

        @keyframes moneyDance {
            0%, 100% { transform: rotate(0deg) scale(1); }
            25% { transform: rotate(5deg) scale(1.1); }
            75% { transform: rotate(-5deg) scale(1.1); }
        }

        .question-text {
            font-size: 1.8rem;
            color: #1e3c3f;
            margin: 40px 0 30px;
            font-family: 'Amiri', serif;
            text-align: center;
        }

        /* Options Container */
        .options-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
            margin-bottom: 30px;
        }

        .option {
            background: white;
            border: 4px solid #1e3c3f;
            border-radius: 40px;
            padding: 25px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 1.2rem;
            color: #1e3c3f;
        }

        .option:hover:not(.disabled) {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 15px 30px rgba(30, 60, 63, 0.4);
            border-color: #c9a86c;
        }

        .option span {
            display: flex;
            align-items: center;
            gap: 15px;
            font-weight: 600;
        }

        .option-icon {
            background: #1e3c3f;
            color: white;
            width: 50px;
            height: 50px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            font-weight: bold;
            font-size: 1.5rem;
            border: 3px solid #c9a86c;
            transition: all 0.3s;
        }

        .option:hover .option-icon {
            transform: rotate(360deg);
            background: #c9a86c;
            color: #1e3c3f;
        }

        .option.correct {
            background: linear-gradient(145deg, #4CAF50, #45a049);
            border-color: #4CAF50;
            color: white;
            animation: winPulse 0.5s ease;
        }

        .option.correct .option-icon {
            background: white;
            color: #4CAF50;
        }

        .option.wrong {
            background: linear-gradient(145deg, #f44336, #d32f2f);
            border-color: #f44336;
            color: white;
            animation: shake 0.5s ease;
        }

        .option.wrong .option-icon {
            background: white;
            color: #f44336;
        }

        .option.disabled {
            pointer-events: none;
            opacity: 0.7;
        }

        @keyframes winPulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); box-shadow: 0 0 50px #4CAF50; }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-10px); }
            40% { transform: translateX(10px); }
        }

        /* Next Button */
        .next-btn {
            background: linear-gradient(145deg, #1e3c3f, #2c5a5e);
            color: white;
            border: 3px solid #c9a86c;
            padding: 18px 50px;
            border-radius: 60px;
            font-size: 1.5rem;
            font-weight: 700;
            cursor: pointer;
            margin: 0 auto;
            display: none;
            transition: all 0.3s;
            width: fit-content;
        }

        .next-btn:hover {
            transform: translateY(-8px) scale(1.1);
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            background: linear-gradient(145deg, #c9a86c, #b8945c);
            color: #1e3c3f;
        }

        .next-btn i {
            margin-left: 15px;
            animation: arrowDance 1s ease-in-out infinite;
        }

        @keyframes arrowDance {
            0%, 100% { transform: translateX(0); }
            50% { transform: translateX(10px); }
        }

        /* Sound Wave */
        .sound-wave {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
            z-index: 2000;
            background: rgba(30, 60, 63, 0.95);
            padding: 20px 40px;
            border-radius: 80px;
            border: 4px solid gold;
            color: white;
            align-items: center;
            box-shadow: 0 0 50px gold;
        }

        .wave-bar {
            width: 8px;
            height: 30px;
            background: gold;
            animation: waveDance 1s ease-in-out infinite;
        }

        .wave-bar:nth-child(2) { animation-delay: 0.1s; }
        .wave-bar:nth-child(3) { animation-delay: 0.2s; }
        .wave-bar:nth-child(4) { animation-delay: 0.3s; }
        .wave-bar:nth-child(5) { animation-delay: 0.4s; }

        @keyframes waveDance {
            0%, 100% { height: 30px; }
            50% { height: 70px; background: #ffd700; }
        }

        /* Visual Feedback */
        .visual-feedback {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 6rem;
            z-index: 10000;
            pointer-events: none;
            animation: popIn 0.5s ease-out;
            font-weight: 800;
            text-align: center;
        }

        @keyframes popIn {
            0% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
            50% { transform: translate(-50%, -50%) scale(1.5); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }

        /* Result Screen */
        .result-screen {
            text-align: center;
            padding: 50px;
        }

        .result-stats {
            display: flex;
            justify-content: center;
            gap: 80px;
            margin-bottom: 50px;
        }

        .result-item .number {
            font-size: 5rem;
            font-weight: 800;
            color: #1e3c3f;
            display: block;
        }

        .total-money {
            background: linear-gradient(145deg, gold, #ffd700);
            color: #1e3c3f;
            padding: 30px 60px;
            border-radius: 120px;
            font-size: 4rem;
            font-weight: 800;
            display: inline-block;
            border: 5px solid #1e3c3f;
            animation: resultMoney 1.5s ease-in-out infinite;
        }

        @keyframes resultMoney {
            0%, 100% { transform: scale(1); box-shadow: 0 0 40px gold; }
            50% { transform: scale(1.1); box-shadow: 0 0 80px gold; }
        }

        .play-again {
            background: linear-gradient(145deg, #1e3c3f, #2c5a5e);
            color: white;
            border: 4px solid gold;
            padding: 20px 60px;
            border-radius: 80px;
            font-size: 2rem;
            font-weight: 700;
            margin-top: 40px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .play-again:hover {
            transform: scale(1.2);
            background: gold;
            color: #1e3c3f;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .options-container {
                grid-template-columns: 1fr;
            }
            
            .audio-permission {
                flex-direction: column;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <!-- Ramadan Decoration -->
    <div class="ramadan-decoration">
        <div class="moon"></div>
        <div class="star star-1">⭐</div>
        <div class="star star-2">⭐</div>
        <div class="star star-3">⭐</div>
        <div class="star star-4">⭐</div>
        <div class="lantern">🏮</div>
        <div class="lantern lantern-2">🏮</div>
    </div>

    <!-- Sound Wave Container -->
    <div id="soundWave" class="sound-wave" style="display: none;">
        <i class="fas fa-volume-up" style="color: gold; margin-right: 15px; font-size: 2rem; animation: spin 1s linear infinite;"></i>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <span id="soundTimer" style="margin-left: 15px; font-size: 1.5rem; font-weight: bold;">🔊6s🔊</span>
    </div>

    <!-- Audio Elements -->
    <audio id="correctSound" preload="auto">
        <source src="https://www.myinstants.com/media/sounds/correct-answer.mp3" type="audio/mpeg">
    </audio>
    
    <audio id="wrongSound" preload="auto">
        <source src="https://www.myinstants.com/media/sounds/wrong-buzzer.mp3" type="audio/mpeg">
    </audio>

    <!-- Main Container -->
    <div class="game-container">
        <!-- Header -->
        <div class="header">
            <div class="school-name">
                <i class="fas fa-mosque"></i>
                Sahal Primary & Secondary Schools
                <i class="fas fa-moon"></i>
            </div>
            <h1 class="contest-title">
                <span>🌙</span> Tartan Diimey Ramadan <span>🌙</span>
            </h1>
        </div>

        <!-- Audio Permission Button -->
        <div class="audio-permission" id="audioPermission">
            <i class="fas fa-volume-mute" style="font-size: 3rem; color: gold; animation: ring 1s infinite;"></i>
            <div>
                <h2 style="font-size: 2rem;">🔇 FUR CODKA!</h2>
                <p style="font-size: 1.2rem;">Riix si aad u maqashid codadka</p>
            </div>
            <button class="enable-audio-btn" onclick="enableAudio()">
                <i class="fas fa-bell"></i>
                Furo Codka!
            </button>
        </div>

        <!-- Score Bar -->
        <div class="score-bar">
            <div class="score-item">
                <i class="fas fa-check-circle"></i>
                <span>Saxay: <span id="correctCount">0</span></span>
            </div>
            <div class="score-item">
                <i class="fas fa-times-circle"></i>
                <span>Qalday: <span id="wrongCount">0</span></span>
            </div>
            <div class="money-display">
                <i class="fas fa-coins"></i>
                <span id="totalMoney">0</span>
            </div>
        </div>

        <!-- Game Area -->
        <div id="gameArea"></div>
    </div>

    <script>
        // Audio Elements
        let correctSound = document.getElementById('correctSound');
        let wrongSound = document.getElementById('wrongSound');
        let soundWaveElement = document.getElementById('soundWave');
        let soundTimer = document.getElementById('soundTimer');
        
        // Game Variables
        let currentQuestion = 0;
        let correctAnswers = 0;
        let wrongAnswers = 0;
        let totalMoney = 0;
        let answered = false;
        let audioEnabled = false;

        // QUESTIONS DATABASE - Correct answers at RANDOM positions (B, T, J, X all mixed)
        const questions = [
            {
                question: "Xukunka zakatul fidriga waa ?",
                options: ["waajib aan ahayn ", "suno  ", " waajib ", "Midna "],
                correct: 2, // j (1st option)
                icons: ["B", "T", "J", "X"]
            },
            {
                question: "Magaca hooyada Cali binu abii daalib waa  ?",
                options: ["caaisha binu abii bakar", "Umu kaltuma ", "Aamina Bintu Wahab", "Faatima Bintu Asad"],
                correct: 3, // x (2nd option)
                icons: ["B", "T", "J", "X"]
            },
            {
                question: "Nebigii lagu soo dajie kitaabka zabuur waa?",
                options: ["Nebi Ciise", "Nebi Maxamed", " Nebi Yacquub", " Nebi Muuse"],
                correct: 2, // J (3rd option)
                icons: ["B", "T", "J", "X"]
            },
            {
                question: "Saxaabigii loo yaqaanay libaaxi alle waa ?",
                options: ["abuu bakar", "Cusman binu cafaan", "Qaalid binu waliid ", "Xamza"],
                correct: 3, // X (4th option)
                icons: ["B", "T", "J", "X"]
            },
            {
                question: "Magaca nebi maxamed hooyadiisu waa ?",
                options: ["Khadiija", "Maryama", "Aaamina", "Midna"],
                correct: 2, // J (3rd option)
                icons: ["B", "T", "J", "X"]
            },
            {
                question: "Nebi ay walaalihisa ceelka ku rideen waa ?",
                options: ["nebi muuse", "nebi zakariye ", "Nebi Yaxye ", "nebi yuusuf "],
                correct: 3, // X (4th option)
                icons: ["B", "T", "J", "X"]
            },
            {
                question: "Soomaaliya waxa ay xurnimada qaadatay ?",
                options: ["1945", "1966 ", "1960", "1987"],
                correct: 2, // J (3rd option)
                icons: ["B", "T", "J", "X"]
            },
            {
                question: "Swabiga ugu dheer aduunka waa ?",
                options: ["webiga furaad", "webiga juba", "webiga shabeele", "webiga niil "],
                correct: 3, // X (4th option)
                icons: ["B", "T", "J", "X"]
            },
            {
                question: "dagaalka af bakeyle waxa uu dhacay  ?",
                options: ["1961", "1901 dii ", "1988", "1900 "],
                correct: 1, // T (4th option)
                icons: ["B", "T", "J", "X"]
            },
            {
                question: "ururka jaamacada carabta waxaa la aas aasay ?",
                options: ["1945", "1966", "1776", "1876"],
                correct: 0, // B (4th option)
                icons: ["B", "T", "J", "X"]
            }
        ];

        // Initialize Game
        function initGame() {
            currentQuestion = 0;
            correctAnswers = 0;
            wrongAnswers = 0;
            totalMoney = 0;
            answered = false;
            updateScore();
            loadQuestion();
        }

        // Load Question
        function loadQuestion() {
            if (currentQuestion >= questions.length) {
                showResults();
                return;
            }

            const q = questions[currentQuestion];
            const gameArea = document.getElementById('gameArea');
            
            gameArea.innerHTML = `
                <div class="question-container">
                    <div class="question-header">
                        <i class="fas fa-question-circle"></i> Su'aasha ${currentQuestion + 1}/${questions.length}
                    </div>
                    <div class="question-money">
                        <i class="fas fa-dollar-sign"></i> 1
                    </div>
                    <div class="question-text">
                        ${q.question}
                    </div>
                    <div class="options-container">
                        ${q.options.map((opt, index) => `
                            <div class="option" onclick="checkAnswer(${index})">
                                <span>
                                    <span class="option-icon">${q.icons[index]}</span>
                                    ${opt}
                                </span>
                            </div>
                        `).join('')}
                    </div>
                    <button class="next-btn" id="nextBtn" onclick="nextQuestion()">
                        Su'aasha Xigta <i class="fas fa-arrow-right"></i>
                    </button>
                </div>
            `;

            answered = false;
        }

        // Enable Audio
        function enableAudio() {
            audioEnabled = true;
            
            correctSound.play().then(() => {
                correctSound.pause();
                correctSound.currentTime = 0;
                document.getElementById('audioPermission').style.display = 'none';
                showVisualFeedback('🔊 CODKA WUU SHAQEEYAA!', '#4CAF50');
            }).catch(error => {
                console.log("Audio error:", error);
                showVisualFeedback('⚠️ RIIX MAR LABEED', 'orange');
            });
        }

        // Play Correct Sound (6 seconds)
        function playCorrectSound() {
            if (!audioEnabled) return;
            
            soundWaveElement.style.display = 'flex';
            soundWaveElement.style.background = 'linear-gradient(135deg, #4CAF50, #45a049)';
            
            correctSound.currentTime = 0;
            correctSound.play().catch(e => console.log(e));
            
            let timeLeft = 6;
            const timerInterval = setInterval(() => {
                timeLeft -= 0.1;
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    soundTimer.innerHTML = '🔊0s🔊';
                    soundWaveElement.style.display = 'none';
                } else {
                    soundTimer.innerHTML = `🔊${timeLeft.toFixed(1)}s🔊`;
                }
            }, 100);
        }

        // Play Wrong Sound (3 seconds)
        function playWrongSound() {
            if (!audioEnabled) return;
            
            soundWaveElement.style.display = 'flex';
            soundWaveElement.style.background = 'linear-gradient(135deg, #f44336, #d32f2f)';
            
            wrongSound.currentTime = 0;
            wrongSound.play().catch(e => console.log(e));
            
            let timeLeft = 3;
            const timerInterval = setInterval(() => {
                timeLeft -= 0.1;
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    soundTimer.innerHTML = '🔊0s🔊';
                    soundWaveElement.style.display = 'none';
                } else {
                    soundTimer.innerHTML = `🔊${timeLeft.toFixed(1)}s🔊`;
                }
            }, 100);
        }

        // Show visual feedback
        function showVisualFeedback(message, color) {
            const fb = document.createElement('div');
            fb.className = 'visual-feedback';
            fb.textContent = message;
            fb.style.color = color;
            document.body.appendChild(fb);
            setTimeout(() => fb.remove(), 1500);
        }

        // Check Answer
        function checkAnswer(selectedIndex) {
            if (answered) return;
            
            const q = questions[currentQuestion];
            const options = document.querySelectorAll('.option');
            const nextBtn = document.getElementById('nextBtn');
            
            answered = true;
            
            options.forEach(opt => opt.classList.add('disabled'));
            options[q.correct].classList.add('correct');
            
            if (selectedIndex === q.correct) {
                correctAnswers++;
                totalMoney++;
                updateScore();
                
                options[selectedIndex].classList.add('correct');
                playCorrectSound();
                showVisualFeedback('🎉 SAX! +$1 🎉', '#4CAF50');
                showMoneyAnimation();
            } else {
                wrongAnswers++;
                updateScore();
                
                options[selectedIndex].classList.add('wrong');
                playWrongSound();
                showVisualFeedback('😢 QALDAN!', '#f44336');
            }
            
            nextBtn.style.display = 'block';
        }

        // Next Question
        function nextQuestion() {
            currentQuestion++;
            loadQuestion();
        }

        // Show Results
        function showResults() {
            const gameArea = document.getElementById('gameArea');
            
            gameArea.innerHTML = `
                <div class="result-screen">
                    <h2 style="font-size: 4rem; color: #1e3c3f;">🌙 WAA DHAMMAAD! 🌙</h2>
                    <div class="result-stats">
                        <div class="result-item">
                            <i class="fas fa-check-circle" style="color: #4CAF50; font-size: 4rem;"></i>
                            <span class="number">${correctAnswers}</span>
                            <span>SAX</span>
                        </div>
                        <div class="result-item">
                            <i class="fas fa-times-circle" style="color: #f44336; font-size: 4rem;"></i>
                            <span class="number">${wrongAnswers}</span>
                            <span>QALDAN</span>
                        </div>
                    </div>
                    <div class="total-money">
                        <i class="fas fa-coins"></i>
                        $${totalMoney}
                    </div>
                    <button class="play-again" onclick="initGame()">
                        <i class="fas fa-redo-alt"></i> KU CELI
                    </button>
                </div>
            `;
        }

        // Update Score
        function updateScore() {
            document.getElementById('correctCount').textContent = correctAnswers;
            document.getElementById('wrongCount').textContent = wrongAnswers;
            document.getElementById('totalMoney').textContent = totalMoney;
        }

        // Money Animation
        function showMoneyAnimation() {
            const md = document.querySelector('.money-display');
            md.style.animation = 'none';
            md.offsetHeight;
            md.style.animation = 'moneyDance 0.5s ease-in-out';
        }

        // Start game
        initGame();
    </script>
</body>
</html>
